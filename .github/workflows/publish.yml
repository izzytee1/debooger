name: Publish Debooger

on:
  push:
    branches: [main]
    paths:
      - 'D2-B*.html'
      - 'deboog*.html'
      - 'index.html'
      - 'Index.html'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: debooger-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Prepare HTML for GitHub Pages
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import shutil
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          out = root / "pages-output"
          out.mkdir(exist_ok=True)
          d2 = re.compile(r"^D2-B(\d+)(?:[ ._-].*)?\.html$", re.I)
          legacy = re.compile(r"^deboog\.(\d+)(?:[ ._-].*)?\.html$", re.I)
          def release(path):
              if not path.is_file():
                  return None
              a = d2.fullmatch(path.name)
              if a: return (2, int(a.group(1)), path.name)
              b = legacy.fullmatch(path.name)
              if b: return (1, int(b.group(1)), path.name)
              return None

          event_file = os.environ.get("GITHUB_EVENT_PATH", "")
          event = json.loads(Path(event_file).read_text()) if event_file else {}
          changed = set()
          for commit in event.get("commits", []):
              changed.update(commit.get("added", []))
              changed.update(commit.get("modified", []))
          if not changed and os.environ.get("GITHUB_EVENT_NAME") == "push":
              diff = subprocess.run(["git", "diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD"],
                                    capture_output=True, text=True, check=True)
              changed.update(diff.stdout.splitlines())

          changed_html = [root / name for name in changed
                          if "/" not in name and (release(root / name) is not None or name.lower() == "index.html")]
          if changed_html:
              # A manual upload publishes the uploaded file, even if its version number is lower.
              selected = max(changed_html, key=lambda p: (p.stat().st_mtime_ns, release(p) or (3, 0, p.name)))
          else:
              candidates = [p for p in root.iterdir() if release(p)]
              selected = max(candidates, key=release) if candidates else root / "index.html"
              if not selected.is_file() and (root / "Index.html").is_file():
                  selected = root / "Index.html"

          if not selected.is_file():
              raise SystemExit("No supported HTML found at repository root.")
          document = selected.read_bytes()
          if b"<html" not in document[:10000].lower():
              raise SystemExit(f"Invalid HTML: {selected.name}")
          shutil.copyfile(selected, out / "index.html")
          if selected.name != "index.html":
              shutil.copyfile(selected, out / selected.name)
          (out / ".nojekyll").touch()
          (out / "version.txt").write_text(
              f"Source: {selected.name}\nCommit: {os.environ.get('GITHUB_SHA', 'unknown')}\n",
              encoding="utf-8")
          print(f"Published {selected.name} as index.html")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-output
      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@v4
